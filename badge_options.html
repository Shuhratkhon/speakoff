<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Badge options</title>
<style>
  body { margin: 0; background: #1E1F22; color: #E6EAF2; font-family: system-ui, sans-serif; padding: 18px; }
  .opt { background: #2B2D30; border-radius: 16px; padding: 16px 18px; margin: 0 auto 14px; max-width: 860px; }
  .opt h2 { margin: 0 0 4px; font-size: 18px; }
  .opt p { margin: 0 0 12px; color: #9AA0AA; font-size: 14px; }
  .row { display: flex; gap: 6px; justify-content: space-between; flex-wrap: wrap; }
  .cell { text-align: center; font-size: 12px; color: #9AA0AA; width: 108px; }
  .cell svg { display: block; margin: 0 auto 4px; overflow: visible; }
  .small { display: flex; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #3a3d42; align-items: center; }
  .small span { font-size: 12px; color: #9AA0AA; margin-right: 6px; }
</style></head>
<body><div id="out"></div>
<script>
const RANKS = [["copper", "#B87333"], ["bronze", "#8C5A2B"], ["silver", "#9EA7B3"], ["gold", "#D4A72C"],
  ["platinum", "#3FB8AF"], ["diamond", "#4C8DF6"], ["master", "#9B59F5"]];
const ROMAN = ["", "I", "II", "III"];
const GOLD = "#F6D365", GOLD_DK = "#B7791F";
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), to = amt > 0 ? 255 : 0, a = Math.abs(amt);
  const ch = (v) => Math.round(v + (to - v) * a).toString(16).padStart(2, "0");
  return `#${ch(n >> 16)}${ch((n >> 8) & 255)}${ch(n & 255)}`;
}
let N = 0;
const poly = (cx, cy, r, n, rot = -90) => Array.from({ length: n }, (_, i) => {
  const a = (rot + i * 360 / n) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
});
const pts = (p) => p.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
const label = (r) => r.div ? ROMAN[r.div] : String(r.wins ?? "★");
const txt = (r, x, y, size, fill, stroke) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="900"
  font-family="system-ui,sans-serif" fill="${fill}" stroke="${stroke}" stroke-width="3" paint-order="stroke">${label(r)}</text>`;
const star = (cx, cy, R, r, fill, stroke = "none", sw = 0) => {
  const p = []; for (let i = 0; i < 10; i++) { const a = (-90 + i * 36) * Math.PI / 180, rr = i % 2 ? r : R; p.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]); }
  return `<polygon points="${pts(p)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
};

// 1 · Crystal: a cut gemstone; more facets, gold prongs, rays and a halo as the rank goes up
function crystal(r, lvl, c, id) {
  const sides = lvl >= 5 ? 8 : 6, O = poly(60, 60, 44, sides), I = poly(60, 60, 22, sides);
  const tones = [.45, .15, -.2, -.45, -.3, .1, .3, -.1];
  let facets = "";
  for (let i = 0; i < sides; i++) { const j = (i + 1) % sides;
    facets += `<polygon points="${pts([O[i], O[j], I[j], I[i]])}" fill="${shade(c, tones[i % 8])}" stroke="${shade(c, .5)}" stroke-width=".8"/>`; }
  const rays = lvl >= 4 ? Array.from({ length: 12 }, (_, i) => { const a = i * 30; return `<rect x="58" y="2" width="4" height="22" rx="2" fill="${shade(c, .4)}" opacity=".55" transform="rotate(${a} 60 60)"/>`; }).join("") : "";
  const prongs = lvl >= 3 ? poly(60, 60, 46, 4, -45).map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="url(#${id}g)" stroke="${GOLD_DK}" stroke-width="1"/>`).join("") : "";
  const halo = lvl === 6 ? `<circle cx="60" cy="60" r="56" fill="none" stroke="${shade(c, .4)}" stroke-width="2" stroke-dasharray="3 5"/><circle cx="60" cy="60" r="52" fill="${c}" opacity=".18"/>` : "";
  return `<defs><radialGradient id="${id}t" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="${shade(c, .5)}"/><stop offset="1" stop-color="${c}"/></radialGradient>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7C2"/><stop offset="1" stop-color="${GOLD_DK}"/></linearGradient></defs>
    ${halo}${rays}<polygon points="${pts(O)}" fill="${shade(c, -.5)}" stroke="${shade(c, -.6)}" stroke-width="3" stroke-linejoin="round"/>${facets}
    <polygon points="${pts(I)}" fill="url(#${id}t)" stroke="${shade(c, .6)}" stroke-width="1"/>${prongs}
    ${star(86, 26, 7, 2, "#FFFFFF")}${txt(r, 60, 70, r.div ? 24 : 26, "#FFFFFF", shade(c, -.6))}`;
}

// 2 · Medal: a struck metal medal on a ribbon; a gold star-burst from Gold, a second rim from Diamond
function medal(r, lvl, c, id) {
  const dk = shade(c, -.45), lt = shade(c, .55);
  const ribbon = `<path d="M36 4 L54 4 L66 46 L48 46 Z" fill="${shade(c, -.25)}"/><path d="M84 4 L66 4 L54 46 L72 46 Z" fill="${shade(c, -.1)}"/>
    <path d="M42 4 L46 4 L58 46 L54 46 Z M78 4 L74 4 L62 46 L66 46 Z" fill="#FFFFFF" opacity=".7"/>`;
  const burst = lvl >= 3 ? star(60, 72, 50, 36, `url(#${id}g)`, GOLD_DK, 1.2).replace("<polygon", `<polygon transform="rotate(18 60 72)"`) + star(60, 72, 50, 36, `url(#${id}g)`, GOLD_DK, 1.2) : "";
  const rim2 = lvl >= 5 ? `<circle cx="60" cy="72" r="41" fill="none" stroke="url(#${id}g)" stroke-width="3"/>` : "";
  const top = lvl === 6 ? star(60, 10, 11, 5, `url(#${id}g)`, GOLD_DK, 1.2) : "";
  return `<defs><linearGradient id="${id}m" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="${lt}"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${dk}"/></linearGradient>
    <radialGradient id="${id}i" cx=".45" cy=".35" r=".75"><stop offset="0" stop-color="${shade(c, .3)}"/><stop offset="1" stop-color="${shade(c, -.25)}"/></radialGradient>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7C2"/><stop offset=".5" stop-color="${GOLD}"/><stop offset="1" stop-color="${GOLD_DK}"/></linearGradient></defs>
    ${ribbon}${burst}${rim2}<circle cx="60" cy="72" r="35" fill="url(#${id}m)" stroke="${shade(c, -.6)}" stroke-width="2.5"/>
    <circle cx="60" cy="72" r="29" fill="none" stroke="${lt}" stroke-width="1.5" stroke-dasharray="2 2.6"/>
    <circle cx="60" cy="72" r="25" fill="url(#${id}i)" stroke="${dk}" stroke-width="1.5"/>
    <path d="M38 58 A30 30 0 0 1 72 44" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".45"/>
    ${top}${txt(r, 60, 81, r.div ? 24 : 26, "#FFFFFF", shade(c, -.6))}`;
}

// 3 · Neon: a dark hexagon with a glowing outline; chevrons show the division (III = 1, I = 3)
function neon(r, lvl, c, id) {
  const glow = shade(c, .35), H = poly(60, 60, 50, 6, 0), H2 = poly(60, 60, 41, 6, 0);
  const chev = (y) => `<path d="M42 ${y} L60 ${y - 10} L78 ${y} L78 ${y + 6} L60 ${y - 4} L42 ${y + 6} Z" fill="${glow}"/>`;
  const n = r.div ? 4 - r.div : 0;
  const ys = n === 1 ? [64] : n === 2 ? [58, 72] : [52, 64, 76];
  const inner = r.div ? ys.slice(0, n).map(chev).join("") : `<path d="M60 34 L74 48 L60 62 L46 48 Z" fill="${glow}"/>${txt(r, 60, 86, 20, "#FFFFFF", "#10131A")}`;
  const brackets = lvl >= 2 ? H.map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${glow}"/>`).join("") : "";
  const lines = lvl >= 4 ? `<path d="M2 60 H14 M106 60 H118 M30 10 L36 20 M90 10 L84 20 M30 110 L36 100 M90 110 L84 100" stroke="${glow}" stroke-width="2.5" stroke-linecap="round"/>` : "";
  const outer2 = lvl === 6 ? `<polygon points="${pts(poly(60, 60, 57, 6, 0))}" fill="none" stroke="${glow}" stroke-width="1.5" stroke-dasharray="6 4"/>` : "";
  return `<defs><filter id="${id}f" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${outer2}${lines}<polygon points="${pts(H)}" fill="#141821" stroke="${glow}" stroke-width="4" filter="url(#${id}f)" stroke-linejoin="round"/>
    <polygon points="${pts(H2)}" fill="none" stroke="${c}" stroke-width="1.2" opacity=".6"/>${brackets}<g filter="url(#${id}f)">${inner}</g>`;
}

// 4 · Crest: a metal diamond with military chevrons; stars on top from Gold, wings from Platinum
function crest(r, lvl, c, id) {
  const dk = shade(c, -.5), lt = shade(c, .5);
  const shape = "M60 6 Q66 6 70 12 L108 54 Q114 60 108 66 L70 108 Q66 114 60 114 Q54 114 50 108 L12 66 Q6 60 12 54 L50 12 Q54 6 60 6 Z";
  const n = r.div ? 4 - r.div : 0;
  const chev = (y) => `<path d="M38 ${y} L60 ${y + 12} L82 ${y} L82 ${y + 8} L60 ${y + 20} L38 ${y + 8} Z" fill="#FFFFFF" stroke="${dk}" stroke-width="1.5" stroke-linejoin="round"/>`;
  const ys = n === 1 ? [52] : n === 2 ? [42, 60] : [34, 50, 66];
  const inner = r.div ? ys.map(chev).join("") : `${star(60, 50, 18, 8, `url(#${id}g)`, GOLD_DK, 1.2)}${txt(r, 60, 92, 20, "#FFFFFF", dk)}`;
  const ns = lvl - 2;
  const stars = lvl >= 3 && lvl < 6 ? Array.from({ length: ns }, (_, i) => star(60 + (i - (ns - 1) / 2) * 16, 2, 7, 3, `url(#${id}g)`, GOLD_DK, 1)).join("") : "";
  const wing = (m) => `<path transform="${m}" d="M22 48 C6 40 -6 44 -12 54 C-2 52 4 54 8 57 C-4 60 -8 66 -8 72 C0 67 6 67 10 69 C4 74 4 80 6 84 C12 76 18 72 24 70 Z" fill="url(#${id}w)" stroke="${dk}" stroke-width="1.3"/>`;
  const wings = lvl >= 4 ? wing("") + wing("translate(120 0) scale(-1 1)") : "";
  const crown = lvl === 6 ? `<path d="M42 4 L40 -14 L51 -5 L60 -20 L69 -5 L80 -14 L78 4 Z" fill="url(#${id}g)" stroke="${GOLD_DK}" stroke-width="1.4" stroke-linejoin="round"/>` : "";
  return `<defs><linearGradient id="${id}o" x1="0" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="${lt}"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${dk}"/></linearGradient>
    <linearGradient id="${id}w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="${lt}"/></linearGradient>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7C2"/><stop offset=".5" stop-color="${GOLD}"/><stop offset="1" stop-color="${GOLD_DK}"/></linearGradient></defs>
    ${wings}<path d="${shape}" fill="url(#${id}o)" stroke="${shade(c, -.65)}" stroke-width="2.5"/>
    <path d="M60 16 L100 60 L60 104 L20 60 Z" fill="none" stroke="${lt}" stroke-width="1.6" opacity=".8" stroke-linejoin="round"/>
    <path d="M60 6 L108 54 L60 30 L12 54 Z" fill="#FFFFFF" opacity=".16"/>${inner}${stars}${crown}`;
}

// 5 · Orbit: a glowing planet; rings and moons add up as the rank goes up, the division is on the planet
function orbit(r, lvl, c, id) {
  const lt = shade(c, .6), dk = shade(c, -.55);
  const rings = lvl >= 3 ? 2 : 1;
  const back = Array.from({ length: rings }, (_, i) => `<ellipse cx="60" cy="62" rx="${50 - i * 8}" ry="${15 - i * 3}" fill="none" stroke="${i ? GOLD : lt}" stroke-width="${3 - i}" transform="rotate(-20 60 62)" clip-path="url(#${id}b)"/>`).join("");
  const front = back.replace(new RegExp(`url\\(#${id}b\\)`, "g"), `url(#${id}f)`);
  const moons = Array.from({ length: Math.min(lvl, 4) }, (_, i) => { const a = (-150 + i * 70) * Math.PI / 180;
    return `<circle cx="${(60 + 52 * Math.cos(a)).toFixed(1)}" cy="${(62 + 52 * Math.sin(a)).toFixed(1)}" r="${4 - i * .4}" fill="${lt}" stroke="${dk}" stroke-width=".8"/>`; }).join("");
  const sparkles = lvl >= 4 ? star(16, 20, 6, 1.6, "#FFFFFF") + star(104, 100, 5, 1.4, "#FFFFFF") + star(100, 18, 4, 1.2, lt) : "";
  const aura = lvl === 6 ? `<circle cx="60" cy="62" r="46" fill="${c}" opacity=".25"/><circle cx="60" cy="62" r="40" fill="${c}" opacity=".25"/>` : "";
  return `<defs><radialGradient id="${id}p" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".25" stop-color="${lt}"/><stop offset=".65" stop-color="${c}"/><stop offset="1" stop-color="${dk}"/></radialGradient>
    <clipPath id="${id}b"><rect x="-10" y="-10" width="140" height="72"/></clipPath><clipPath id="${id}f"><rect x="-10" y="62" width="140" height="70"/></clipPath></defs>
    ${aura}${sparkles}${back}<circle cx="60" cy="62" r="32" fill="url(#${id}p)" stroke="${dk}" stroke-width="2"/>
    <path d="M40 76 Q60 86 82 72" fill="none" stroke="${dk}" stroke-width="3" opacity=".25"/>${front}${moons}
    ${txt(r, 60, 71, r.div ? 24 : 24, "#FFFFFF", dk)}`;
}

const STYLES = [
  ["crystal", "1 · Crystal", "A cut gemstone. More facets from Diamond, gold prongs from Gold, light rays from Platinum, a halo for Master.", crystal],
  ["medal", "2 · Medal", "A struck metal medal on a ribbon. Gold star-burst from Gold, a second gold rim from Diamond, a star on top for Master.", medal],
  ["neon", "3 · Neon", "A dark hexagon with a glowing outline. Chevrons show the stage (III = 1, II = 2, I = 3). Corner lights from Silver, side lines from Platinum.", neon],
  ["crest", "4 · Crest", "A metal diamond with military chevrons for the stage. Stars on top from Gold, wings from Platinum, a crown for Master.", crest],
  ["orbit", "5 · Orbit", "A glowing planet with the stage on it. More moons and a second gold ring as the rank goes up, sparkles from Platinum, an aura for Master.", orbit],
];
const list = [["copper", 3], ["bronze", 2], ["silver", 1], ["gold", 2], ["platinum", 3], ["diamond", 1], ["master", null]];
const name = (k) => k[0].toUpperCase() + k.slice(1);
function badge(fn, rank, div, size) {
  const lvl = RANKS.findIndex((x) => x[0] === rank), c = RANKS[lvl][1], r = { rank, div, wins: div ? null : 27 };
  return `<svg width="${size}" height="${size}" viewBox="-14 -24 148 148">${fn(r, lvl, c, "b" + (++N))}</svg>`;
}
let h = "";
for (const [, title, about, fn] of STYLES) {
  h += `<div class="opt"><h2>${title}</h2><p>${about}</p><div class="row">${list.map(([k, d]) =>
    `<div class="cell">${badge(fn, k, d, 100)}${name(k)} ${d ? ROMAN[d] : "27"}</div>`).join("")}</div>
    <div class="small"><span>In lists:</span>${list.map(([k, d]) => badge(fn, k, d, 26)).join("")}</div></div>`;
}
document.getElementById("out").innerHTML = h;
</script></body></html>
