<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E1F22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Speak for one minute in English and get your fluency, grammar, vocabulary and pronunciation scores, your CEFR / IELTS / TOEFL level and a personal coach.">
  <title>Speakoff</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>
    // set the theme before the page draws, so it never flashes the wrong colours
    try { document.documentElement.dataset.theme = localStorage.getItem("sc-theme") || "dark"; } catch (e) {}
  </script>
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="splash"><div class="spinner"></div></div>
  </main>

  <!-- App Store-style bottom bar: four tabs in a pill + a round Profile button (like Search) -->
  <nav id="tabbar" class="tabbar" hidden>
    <div class="tabpill">
      <a href="#/home" data-tab="home" class="tab"><span class="ic" data-icon="home"></span><span class="tl" data-t="tab_home">Home</span></a>
      <a href="#/progress" data-tab="progress" class="tab"><span class="ic" data-icon="progress"></span><span class="tl" data-t="tab_progress">Progress</span></a>
      <a href="#/record" data-tab="record" class="tab"><span class="ic" data-icon="mic"></span><span class="tl" data-t="tab_record">Record</span></a>
      <a href="#/ranked" data-tab="ranked" class="tab"><span class="ic" data-icon="trophy"></span><span class="tl" data-t="tab_ranked">Ranked</span></a>
    </div>
    <a href="#/profile" data-tab="profile" class="tabround" aria-label="Profile"><span class="ic" data-icon="user"></span></a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="script.js"></script>
</body>
</html>
